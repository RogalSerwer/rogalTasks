name: Dev Deployment
on:
  push:
    branches:
      - dev
jobs:
  deploy:
    name: Deploy dev branch on server
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: dev
      - name: Teardown
        working-directory: dev
        run: ./teardown.sh
      - name: Deploy Docker
        working-directory: dev
        run: ./deploy.sh
