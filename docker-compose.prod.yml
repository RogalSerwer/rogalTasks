services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_BACKEND: ${BACKEND_URL}
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - TZ=Europe/Warsaw
    depends_on:
      backend:
        condition: service_started

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "${BACKEND_PORT}:5000"
    environment:
      - DB_USER=${DB_USER}
      - PASSWORD=${PASSWORD}
      - DATABASE=${DATABASE}
      - TZ=Europe/Warsaw
    depends_on:
      migration:
        condition: service_completed_successfully
  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile.prod
    environment:
      - DB_USER=${DB_USER}
      - PASSWORD=${PASSWORD}
      - DATABASE=${DATABASE}
      - DISCORD=${DISCORD}
      - TZ=Europe/Warsaw
    depends_on:
      backend:
        condition: service_started

  db:
    image: mariadb:11.8
    environment:
      - MARIADB_DATABASE="${DATABASE}"
      - MARIADB_ROOT_PASSWORD="${PASSWORD}"
      - MARIADB_PASSWORD="${PASSWORD}"
      - MARIADB_USER="${DB_USER}"
      - TZ=Europe/Warsaw
    ports:
     - "3386:3306"
    volumes:
      - tasksDBProd:/var/lib/mysql
      - ./migration/db_init.sql:/docker-entrypoint-initdb.d/init.sql

  migration:
    build:
      context: ./migration
      dockerfile: Dockerfile.prod
    environment:
      - DB_USER=${DB_USER}
      - PASSWORD=${PASSWORD}
      - DATABASE=${DATABASE}
      - TZ=Europe/Warsaw
    depends_on:
      db:
        condition: service_started
    restart: "no"

volumes:
  tasksDBProd: