services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_BACKEND: ${BACKEND_URL}
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      backend:
        condition: service_started

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "${BACKEND_PORT}:5000"
    environment:
      - DB_USER=${DB_USER}
      - PASSWORD=${PASSWORD}
      - DATABASE=${DATABASE}
    depends_on:
      migration:
        condition: service_completed_successfully
  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile.prod
    environment:
      - DB_USER=${DB_USER}
      - PASSWORD=${PASSWORD}
      - DATABASE=${DATABASE}
      - DISCORD=${DISCORD}
    depends_on:
      backend:
        condition: service_started

  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: "${PASSWORD}"
      MARIADB_DATABASE: "${DATABASE}"
      MARIADB_USER: "${DB_USER}"
      MARIADB_PASSWORD: "${PASSWORD}"
    ports:
     - "3386:3306"
    volumes:
      - tasksDBProd:/var/lib/mysql
      - ./migration/db_init.sql:/docker-entrypoint-initdb.d/init.sql

  migration:
    build:
      context: ./migration
      dockerfile: Dockerfile.prod
    environment:
      - DB_USER=${DB_USER}
      - PASSWORD=${PASSWORD}
      - DATABASE=${DATABASE}
    depends_on:
      db:
        condition: service_started
    restart: "no"

volumes:
  tasksDBProd: