services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/tasksFrontend
      - /tasksFrontend/node_modules
    command: sh -c "npm ci && npm run dev -- --host --port 3000"
    environment:
      - VITE_BACKEND=${BACKEND_URL}
    depends_on:
      backend:
        condition: service_started

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT}:5000"
    volumes:
      - ./backend:/tasksBackend
    environment:
      - DB_USER=${DB_USER}
      - PASSWORD=${PASSWORD}
      - DATABASE=${DATABASE}
    depends_on:
      migration:
        condition: service_completed_successfully

  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: "${PASSWORD}"
      MARIADB_DATABASE: "${DATABASE}"
      MARIADB_USER: "${DB_USER}"
      MARIADB_PASSWORD: "${PASSWORD}"
    ports:
     - "3366:3306"
    volumes:
      - tasksDB:/var/lib/mysql
      - ./migration/db_init.sql:/docker-entrypoint-initdb.d/init.sql

  migration:
    build: ./migration
    volumes:
      - ./migration:/tasksMigration
    environment:
      - DB_USER=${DB_USER}
      - PASSWORD=${PASSWORD}
      - DATABASE=${DATABASE}
    depends_on:
      db:
        condition: service_started
    restart: "no"

volumes:
  tasksDB:
    name: tasksDB